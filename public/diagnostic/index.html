<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>NORA · Diagnóstico CONECTA</title>
  <style>
    :root{color-scheme:dark;--bg:#070a12;--panel:#101626;--line:#25304a;--text:#f8fafc;--muted:#9ca9c4;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#60a5fa}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#17162a 0,#070a12 42%);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    button,a{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px 14px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px}.avatar{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#7c3aed,#a855f7);display:grid;place-items:center;font-size:26px;box-shadow:0 14px 35px #7c3aed44}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.badge{padding:8px 11px;border:1px solid var(--line);background:#0d1321;border-radius:999px;color:#c6d0e5;font-size:12px;white-space:nowrap}
    .hero{background:linear-gradient(180deg,#11192b,#0d1321);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 50px #0007}.hero-grid{display:grid;grid-template-columns:150px 150px 1fr;gap:16px;align-items:center}.score{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--tone) var(--pct,0%),#202940 0);position:relative}.score:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#0f1626}.score strong{position:relative;z-index:1;font-size:34px;text-align:center;line-height:1.05}.score small{position:absolute;z-index:1;margin-top:58px;color:var(--muted);font-size:10px;text-align:center;max-width:92px;line-height:1.1}.score-findings{background:conic-gradient(var(--find-tone) var(--find-pct,0%),#202940 0)}.hero h2{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:var(--muted)}
    .capacity{margin-top:10px;display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid #34415f;border-radius:12px;background:#0b1220;color:#cbd5e1;font-size:12px}.capacity b{color:#fff}.countdown{margin-top:9px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.count-pill{padding:8px 10px;border:1px solid #34415f;border-radius:12px;background:#0b1220;color:#cbd5e1;font-size:12px}.count-pill b{color:#fff}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:13px;border:1px solid var(--line);background:#0e1525;border-radius:16px;text-align:left;color:var(--text);cursor:pointer;transition:.15s transform,.15s border-color,.15s background}.stat:hover{transform:translateY(-1px);border-color:#556789}.stat.active{border-color:#8b5cf6;background:#15152b;box-shadow:0 0 0 1px #8b5cf655 inset}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:16px 0;flex-wrap:wrap}.toolbar .actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar button,.toolbar a{border:1px solid #3a4770;background:#141d32;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700;text-decoration:none;cursor:pointer}.toolbar button.primary{background:#6d28d9;border-color:#7c3aed}.toolbar button:disabled{opacity:.55;cursor:not-allowed}.toolbar small{color:var(--muted)}
    .filter-title{margin:6px 0 2px;color:#d7dff0;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.filter-title button{border:0;background:transparent;color:#93c5fd;padding:6px 0;cursor:pointer;font-weight:700}.layer{margin-top:14px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0d1321}.layer.hidden{display:none}.layer h3{margin:0;padding:14px 15px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;gap:10px}.layer h3 small{color:var(--muted);font-weight:500}.layer-errors h3{color:#fca5a5}.layer-watch h3{color:#fcd34d}.layer-corrected h3{color:#86efac}.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 14px;border-bottom:1px solid #1d2740}.item:last-child{border-bottom:0}.dot{width:23px;height:23px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900}.fail .dot{background:#47191d;color:#fca5a5}.warn .dot{background:#422f10;color:#fcd34d}.corrected .dot{background:#163823;color:#86efac}.item b{display:block;font-size:13px}.item p{margin:2px 0 0;color:var(--muted);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.sev{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.copy-one{margin-top:7px;border:1px solid #34415f;background:#0b1220;color:#cbd5e1;border-radius:9px;padding:6px 8px;font-size:10px;cursor:pointer}.empty{padding:15px;color:var(--muted);font-size:12px}.note{margin-top:16px;padding:13px 14px;border:1px dashed #34415f;border-radius:15px;color:#aab5cc;font-size:11px}.loading{padding:40px;text-align:center;color:var(--muted)}.toast{position:fixed;right:14px;bottom:18px;background:#111827;border:1px solid #374151;border-radius:12px;padding:10px 12px;color:#fff;font-size:12px;box-shadow:0 16px 40px #0008;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:760px){.hero-grid{grid-template-columns:112px 112px 1fr}.score strong{font-size:27px}.score small{margin-top:47px;font-size:8px}.hero h2{font-size:19px}}
    @media(max-width:560px){.wrap{padding:12px 10px 40px}.hero-grid{grid-template-columns:1fr 1fr}.hero-copy{grid-column:1/-1}.score{max-width:132px;width:100%;justify-self:center}.score strong{font-size:28px}.score small{margin-top:48px;font-size:8px}.stats{grid-template-columns:repeat(3,1fr)}.item{grid-template-columns:25px 1fr}.sev{display:none}.badge{display:none}.stat{padding:11px 9px}.stat b{font-size:20px}.stat span{font-size:9px}.toolbar .actions{width:100%}.toolbar button,.toolbar a{flex:1;text-align:center}.copy-one{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="avatar">🧠</div><div><h1>NORA · CONECTA Diagnostic</h1><p>Ingeniera virtual de diagnóstico · solo lectura</p></div></div>
      <div class="badge">Escaneo cada 5 horas · capacidad 999</div>
    </header>
    <section id="app" class="loading">Cargando último diagnóstico…</section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const label={healthy:'Todo estable',warning:'Hay puntos que vigilar',error:'Hay errores',critical:'Hay fallos críticos'};
    const state={data:null,filter:'all',timer:null,loading:false};
    const workflowUrl='https://github.com/fernandoexposito96/Proyecto-CONECTA/actions/workflows/diagnostic-hourly.yml';
    const typeMeta={errors:{name:'Errores',icon:'❌',className:'fail'},watch:{name:'Vigilar',icon:'⚠️',className:'warn'},corrected:{name:'Errores corregidos',icon:'✅',className:'corrected'}};
    const itemText=(x,type)=>`[${typeMeta[type].name}] ${x.label||'Sin título'}\nÁrea: ${x.area||'Sin área'}\nSeveridad: ${type==='corrected'?'corregido':(x.severity||'sin clasificar')}\nDetalle: ${x.detail||'Sin detalle'}${x.id?`\nID: ${x.id}`:''}`;
    const showToast=(msg)=>{const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),1800)};
    async function copyText(text){try{await navigator.clipboard.writeText(text);showToast('Copiado al portapapeles');}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Copiado al portapapeles');}}
    window.copyFinding=(type,index)=>{const arr=state.data?.[type]||[];if(arr[index])copyText(itemText(arr[index],type));};
    window.copyVisible=()=>{if(!state.data)return;const keys=state.filter==='all'?['errors','watch','corrected']:[state.filter];const chunks=keys.flatMap(k=>(state.data[k]||[]).map(x=>itemText(x,k)));copyText(chunks.length?chunks.join('\n\n--------------------\n\n'):'No hay hallazgos visibles.');};
    const row=(x,type,index)=>`<div class="item ${typeMeta[type].className}"><div class="dot">${type==='corrected'?'✓':type==='watch'?'!':'×'}</div><div><b>${esc(x.label)}</b><p>${esc(x.detail)}</p><p>${esc(x.area||'')}</p><button class="copy-one" onclick="copyFinding('${type}',${index})">Copiar este hallazgo</button></div><div class="sev">${esc(type==='corrected'?'corregido':x.severity)}</div></div>`;
    const fmtRemaining=(ms)=>{if(ms<=0)return '00:00:00';const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`};
    function updateCountdown(){if(!state.data)return;const el=document.querySelector('#countdown');if(!el)return;const finished=new Date(state.data.finished_at).getTime();const next=finished+5*60*60*1000;const remaining=next-Date.now();el.innerHTML=remaining>0?`Próximo automático aprox.: <b>${fmtRemaining(remaining)}</b>`:'Próximo ciclo automático: <b>pendiente/inminente</b>';}
    window.setFilter=(filter)=>{state.filter=filter;document.querySelectorAll('.stat').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));document.querySelectorAll('.layer').forEach(x=>x.classList.toggle('hidden',filter!=='all'&&x.dataset.layer!==filter));const title=document.querySelector('#filterLabel');if(title)title.textContent=filter==='all'?'Mostrando las tres categorías':`Mostrando solo: ${typeMeta[filter].name}`;};
    window.refreshReport=async()=>{await load(true);};
    function normalize(d){const all=(d.results||[]).slice(0,999);const errors=(d.errors||all.filter(x=>x.status==='fail')).slice(0,999);const watch=(d.watch||all.filter(x=>x.status==='warn'||(x.status==='ok'&&x.severity==='warning'))).slice(0,Math.max(0,999-errors.length));const corrected=(d.corrected||[]).slice(0,999);return {...d,all,errors,watch,corrected};}
    async function load(manual=false){
      if(state.loading)return;state.loading=true;const app=document.querySelector('#app');
      try{
        const r=await fetch('./report.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
        const d=normalize(await r.json());state.data=d;
        const tone=d.overall==='healthy'?'var(--green)':d.overall==='warning'?'var(--amber)':'var(--red)';
        const time=new Date(d.finished_at).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'medium'});
        const health=Math.max(0,Math.min(100,Number(d.score)||0));
        const maxFindings=Math.max(1,Math.min(999,Number(d.max_findings)||999));
        const activeFindings=Math.min(maxFindings,d.errors.length+d.watch.length);
        const findingsPct=Math.min(100,(activeFindings/maxFindings)*100);
        const findingsTone=d.errors.length?'var(--red)':d.watch.length?'var(--amber)':'var(--green)';
        app.className='';
        app.innerHTML=`<section class="hero"><div class="hero-grid"><div class="score" style="--pct:${health}%;--tone:${tone}"><strong>${esc(health)}%</strong><small>ÍNDICE DE SALUD</small></div><div class="score score-findings" style="--find-pct:${findingsPct}%;--find-tone:${findingsTone}"><strong>${esc(activeFindings)}<span style="font-size:.48em;color:var(--muted)">/${esc(maxFindings)}</span></strong><small>FALLOS + VIGILAR</small></div><div class="hero-copy"><h2>${esc(label[d.overall]||d.overall)}</h2><p>NORA ha completado ${esc(d.all.length)} comprobaciones de punta a punta.</p><p style="margin-top:6px">Último escaneo: <b>${esc(time)}</b></p><div class="capacity">Capacidad del escáner: <b>${esc(maxFindings)} errores/avisos</b></div><div class="countdown"><div id="countdown" class="count-pill"></div></div></div></div><div class="stats"><button class="stat" data-filter="errors" onclick="setFilter('errors')"><b>${d.errors.length}</b><span>ERRORES</span></button><button class="stat" data-filter="watch" onclick="setFilter('watch')"><b>${d.watch.length}</b><span>VIGILAR</span></button><button class="stat" data-filter="corrected" onclick="setFilter('corrected')"><b>${d.corrected.length}</b><span>ERRORES CORREGIDOS</span></button></div></section><div class="toolbar"><small>Commit: ${esc(String(d.commit||'').slice(0,10))}</small><div class="actions"><button class="primary" onclick="refreshReport()">Actualizar panel ahora</button><a href="${workflowUrl}" target="_blank" rel="noopener">Lanzar escaneo completo</a><button onclick="copyVisible()">Copiar visibles</button></div></div><div class="filter-title"><span id="filterLabel">Mostrando las tres categorías</span><button onclick="setFilter('all')">Ver todo</button></div><section class="layer layer-errors" data-layer="errors"><h3>❌ Errores <small>${d.errors.length}</small></h3>${d.errors.length?d.errors.map((x,i)=>row(x,'errors',i)).join(''):'<div class="empty">No hay errores confirmados en este escaneo.</div>'}</section><section class="layer layer-watch" data-layer="watch"><h3>⚠️ Vigilar <small>${d.watch.length}</small></h3>${d.watch.length?d.watch.map((x,i)=>row(x,'watch',i)).join(''):'<div class="empty">No hay avisos o riesgos pendientes en este escaneo.</div>'}</section><section class="layer layer-corrected" data-layer="corrected"><h3>✅ Errores corregidos <small>${d.corrected.length}</small></h3>${d.corrected.length?d.corrected.map((x,i)=>row(x,'corrected',i)).join(''):'<div class="empty">Todavía no hay errores anteriores confirmados como corregidos. NORA solo añadirá aquí un punto cuando antes estuviera mal o en vigilancia y ahora pase correctamente.</div>'}</section><div class="note">${esc(d.coverage_note||'')} El índice de salud se expresa de 0% a 100% y no representa el número de fallos. El segundo círculo muestra cuántos errores + puntos a vigilar hay dentro de la capacidad máxima de 999. Una prueba no ejecutada nunca se presenta como correcta ni como corregida. “Actualizar panel ahora” recarga inmediatamente el último informe publicado. “Lanzar escaneo completo” abre de forma segura el workflow manual de NORA; no se incrustan credenciales de GitHub en esta página pública.</div>`;
        updateCountdown();setFilter(state.filter);if(manual)showToast('Panel actualizado con el último informe publicado');
      }catch(e){app.className='loading';app.innerHTML='No se ha podido cargar el informe todavía. NORA volverá a intentarlo automáticamente.';}finally{state.loading=false;}
    }
    load();setInterval(()=>load(false),60000);state.timer=setInterval(updateCountdown,1000);
  </script>
</body>
</html>
