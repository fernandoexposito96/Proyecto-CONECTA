name: Deploy CONECTA Premium Max

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed versions
        run: npm ls @supabase/supabase-js@2.115.0 react@19.2.6 react-dom@19.2.6 vite@8.2.2 typescript@5.9.3 --depth=0
      - name: Production security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Structure, tests and type check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conecta-check-log-${{ github.run_id }}
          path: check.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build
        run: npm run build
      - name: Bundle performance budget
        run: node scripts/check-bundle-budget.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression gate
        timeout-minutes: 6
        run: npm run test:e2e -- --grep-invert "layout audit|map treats plan titles as text instead of executable HTML"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload exact build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact validated build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
