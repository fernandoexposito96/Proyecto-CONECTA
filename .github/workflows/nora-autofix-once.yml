name: NORA verify safe fix once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nora-autofix-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify native report prompt is gone
        run: |
          if grep -R 'window\.prompt("Motivo del reporte' src/App.tsx; then
            echo "Native report prompt still present"
            exit 1
          fi
          grep -q 'DialogTitle>Reportar a' src/App.tsx
      - name: Validate production quality gate
        run: |
          pnpm run validate
          pnpm run test:accessibility
          mkdir -p .nora
          printf '{"unit":true,"e2e":true,"accessibility":true,"commit":"%s"}\n' "$GITHUB_SHA" > .nora/validate-ok.json
      - name: Validate clean Home and Chat release
        run: node scripts/visual-release-contracts.mjs
      - name: Generate NORA base report
        env:
          VITE_SUPABASE_URL: https://qdjuypoqiafqncwgmicf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cJAhkB9oDjK-ecmrEshNvA_79F3_G55
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          CONECTA_ROBOT_MAX_FINDINGS: "999"
        run: node scripts/diagnostic-scan.mjs
      - name: Deep NORA functional verification
        run: node scripts/nora-deep-checks.mjs
      - name: Build with latest diagnostic
        run: pnpm run build
      - name: Upload NORA evidence
        uses: actions/upload-artifact@v4
        with:
          name: nora-safe-fix-evidence
          path: |
            public/diagnostic/report.json
            .nora/validate-ok.json
            playwright-report
          if-no-files-found: error
