name: Deploy CONECTA Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-manual
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          node-version: 22
          cache: true
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Validate release candidate
        run: |
          pnpm run validate
          mkdir -p .nora
          printf '{"unit":true,"e2e":true,"accessibility":true,"commit":"%s"}\n' "$GITHUB_SHA" > .nora/validate-ok.json
      - name: Generate NORA base report
        env:
          VITE_SUPABASE_URL: https://qdjuypoqiafqncwgmicf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cJAhkB9oDjK-ecmrEshNvA_79F3_G55
          CONECTA_ROBOT_MAX_FINDINGS: "999"
        run: node scripts/diagnostic-scan.mjs
      - name: Finalize NORA evidence report
        run: node scripts/nora-deep-checks.mjs
      - name: Rebuild with final NORA report
        run: pnpm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
