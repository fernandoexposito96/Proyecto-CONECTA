name: CONECTA Diagnostic Robot

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/**"
  schedule:
    # GitHub Actions cron siempre se evalúa en UTC.
    - cron: "17 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: conecta-nora-pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify pinned Playwright engines
        run: npx playwright install --list

      - name: NORA professional end-to-end diagnostic
        id: nora_scan
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          CONECTA_ROBOT_MAX_FINDINGS: "999"
        run: node scripts/nora-professional-scan.mjs

      - name: Build app with latest diagnostic report
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Record diagnostic outcome
        if: always()
        run: echo "NORA scan outcome: ${{ steps.nora_scan.outcome }}. The panel is published even when findings exist, so failures remain visible instead of leaving a stale report."

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish CONECTA + NORA report
        id: deployment
        uses: actions/deploy-pages@v4
