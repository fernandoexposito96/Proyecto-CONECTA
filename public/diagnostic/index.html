<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>NORA · Diagnóstico CONECTA</title>
  <style>
    :root{color-scheme:dark;--bg:#070a12;--panel:#101626;--line:#25304a;--text:#f8fafc;--muted:#9ca9c4;--green:#22c55e;--amber:#f59e0b;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#17162a 0,#070a12 42%);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    .wrap{max-width:980px;margin:auto;padding:18px 14px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px}.avatar{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#7c3aed,#a855f7);display:grid;place-items:center;font-size:26px;box-shadow:0 14px 35px #7c3aed44}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.badge{padding:8px 11px;border:1px solid var(--line);background:#0d1321;border-radius:999px;color:#c6d0e5;font-size:12px;white-space:nowrap}
    .hero{background:linear-gradient(180deg,#11192b,#0d1321);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 50px #0007}.hero-grid{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:center}.score{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--tone) var(--pct,0%),#202940 0);position:relative}.score:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#0f1626}.score strong{position:relative;z-index:1;font-size:34px}.score small{position:absolute;z-index:1;margin-top:54px;color:var(--muted)}.hero h2{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:13px;border:1px solid var(--line);background:#0e1525;border-radius:16px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:16px 0}.toolbar button{border:1px solid #3a4770;background:#141d32;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}.toolbar small{color:var(--muted)}
    .layer{margin-top:14px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0d1321}.layer h3{margin:0;padding:14px 15px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;gap:10px}.layer h3 small{color:var(--muted);font-weight:500}.layer-errors h3{color:#fca5a5}.layer-watch h3{color:#fcd34d}.layer-corrected h3{color:#86efac}.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 14px;border-bottom:1px solid #1d2740}.item:last-child{border-bottom:0}.dot{width:23px;height:23px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900}.fail .dot{background:#47191d;color:#fca5a5}.warn .dot{background:#422f10;color:#fcd34d}.corrected .dot{background:#163823;color:#86efac}.item b{display:block;font-size:13px}.item p{margin:2px 0 0;color:var(--muted);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.sev{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.empty{padding:15px;color:var(--muted);font-size:12px}.note{margin-top:16px;padding:13px 14px;border:1px dashed #34415f;border-radius:15px;color:#aab5cc;font-size:11px}.loading{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:640px){.wrap{padding:12px 10px 40px}.hero-grid{grid-template-columns:112px 1fr}.score strong{font-size:27px}.score small{margin-top:43px;font-size:10px}.stats{grid-template-columns:repeat(3,1fr)}.hero h2{font-size:20px}.item{grid-template-columns:25px 1fr}.sev{display:none}.badge{display:none}.stat{padding:11px 9px}.stat b{font-size:20px}.stat span{font-size:9px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="avatar">🧠</div><div><h1>NORA · CONECTA Diagnostic</h1><p>Ingeniera virtual de diagnóstico · solo lectura</p></div></div>
      <div class="badge">Escaneo cada 5 horas · capacidad 999</div>
    </header>
    <section id="app" class="loading">Cargando último diagnóstico…</section>
  </main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const label={healthy:'Todo estable',warning:'Hay puntos que vigilar',error:'Hay errores',critical:'Hay fallos críticos'};
    const row=(x,type)=>`<div class="item ${type}"><div class="dot">${type==='corrected'?'✓':type==='warn'?'!':'×'}</div><div><b>${esc(x.label)}</b><p>${esc(x.detail)}</p><p>${esc(x.area||'')}</p></div><div class="sev">${esc(type==='corrected'?'corregido':x.severity)}</div></div>`;
    async function load(){
      const app=document.querySelector('#app');
      try{
        const r=await fetch('./report.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
        const d=await r.json();
        const all=(d.results||[]).slice(0,999);
        const errors=(d.errors||all.filter(x=>x.status==='fail')).slice(0,999);
        const watch=(d.watch||all.filter(x=>x.status==='warn'||(x.status==='ok'&&x.severity==='warning'))).slice(0,Math.max(0,999-errors.length));
        const corrected=(d.corrected||[]).slice(0,999);
        const tone=d.overall==='healthy'?'var(--green)':d.overall==='warning'?'var(--amber)':'var(--red)';
        const time=new Date(d.finished_at).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'medium'});
        app.className='';
        app.innerHTML=`<section class="hero"><div class="hero-grid"><div class="score" style="--pct:${Number(d.score)||0}%;--tone:${tone}"><strong>${esc(d.score)}/100</strong><small>salud</small></div><div><h2>${esc(label[d.overall]||d.overall)}</h2><p>NORA ha completado ${esc(all.length)} comprobaciones de punta a punta.</p><p style="margin-top:6px">Último escaneo: <b>${esc(time)}</b></p><p style="margin-top:6px">Capacidad máxima: <b>${esc(d.max_findings||999)} hallazgos</b></p></div></div><div class="stats"><div class="stat"><b>${errors.length}</b><span>ERRORES</span></div><div class="stat"><b>${watch.length}</b><span>VIGILAR</span></div><div class="stat"><b>${corrected.length}</b><span>ERRORES CORREGIDOS</span></div></div></section><div class="toolbar"><small>Commit: ${esc(String(d.commit||'').slice(0,10))}</small><button onclick="load()">Actualizar ahora</button></div><section class="layer layer-errors"><h3>❌ Errores <small>${errors.length}</small></h3>${errors.length?errors.map(x=>row(x,'fail')).join(''):'<div class="empty">No hay errores confirmados en este escaneo.</div>'}</section><section class="layer layer-watch"><h3>⚠️ Vigilar <small>${watch.length}</small></h3>${watch.length?watch.map(x=>row(x,'warn')).join(''):'<div class="empty">No hay avisos o riesgos pendientes en este escaneo.</div>'}</section><section class="layer layer-corrected"><h3>✅ Errores corregidos <small>${corrected.length}</small></h3>${corrected.length?corrected.map(x=>row(x,'corrected')).join(''):'<div class="empty">Todavía no hay errores anteriores confirmados como corregidos. NORA solo añadirá aquí un punto cuando antes estuviera mal o en vigilancia y ahora pase correctamente.</div>'}</section><div class="note">${esc(d.coverage_note||'')} Capacidad máxima: 999 hallazgos. Una prueba no ejecutada nunca se presenta como correcta ni como corregida.</div>`;
      }catch(e){app.className='loading';app.innerHTML='No se ha podido cargar el informe todavía. NORA volverá a intentarlo automáticamente.';}
    }
    load(); setInterval(load,60000);
  </script>
</body>
</html>
