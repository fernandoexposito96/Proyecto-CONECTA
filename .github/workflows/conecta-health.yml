name: CONECTA Health Check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: Robot job id
        required: false
        default: manual
      scan_mode:
        description: Scan mode
        required: false
        default: full
      reason:
        description: Trigger reason
        required: false
        default: manual

permissions:
  contents: read

env:
  CONECTA_ROBOT_MAX_FINDINGS: "1000"

jobs:
  health:
    name: robot-full-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Escaneo completo del robot
        id: full_scan
        continue-on-error: true
        run: node scripts/robot-health-scan.mjs
      - name: Apartado · Todos los fallos
        if: always()
        run: |
          if [ -f robot-reports/latest.md ]; then
            cat robot-reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# CONECTA Robot · Informe completo" >> "$GITHUB_STEP_SUMMARY"
            echo "No se pudo generar el informe. Esto se considera un fallo del escáner." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar informe completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conecta-robot-report-${{ github.run_number }}
          path: robot-reports/
          if-no-files-found: error
          retention-days: 30
      - name: Marcar ejecución como fallida si hay fallos duros
        if: steps.full_scan.outcome == 'failure'
        run: exit 1
