name: Generate package lock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when package-lock already exists
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.lock.outputs.exists == 'false'
        with:
          node-version: 22
      - name: Generate deterministic lockfile
        if: steps.lock.outputs.exists == 'false'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock
        if: steps.lock.outputs.exists == 'false'
        run: |
          git config user.name "CONECTA CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock verified npm dependency graph"
          git push
