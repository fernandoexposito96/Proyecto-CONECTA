name: Deploy CONECTA Premium Max

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed versions
        run: npm ls @supabase/supabase-js@2.115.0 react@19.2.6 react-dom@19.2.6 vite@8.2.2 typescript@5.9.3 @vitejs/plugin-react@6.0.2 --depth=0
      - name: Production security audit (non-blocking deploy signal)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Structure, tests and type check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conecta-check-log
          path: check.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
