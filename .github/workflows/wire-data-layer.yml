name: Wire optimized data layer

on:
  push:
    branches: [perf-wire-data-layer]
    paths:
      - '.github/workflows/wire-data-layer.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-wire-data-layer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire bounded loader into App
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace(
            'import { demoProfiles, isDemoModeEnabled, mergeDemoCommunities, mergeDemoPlans, mergeDemoProfiles, setDemoModeEnabled } from "./demoMode";',
            'import { demoProfiles, isDemoModeEnabled, setDemoModeEnabled } from "./demoMode";\nimport { loadConectaData } from "./data/loadConectaData";'
          )
          start = s.index('  const loadData = useCallback(async (currentUser: User) => {')
          end_marker = '  }, [demoModeEnabled]);'
          end = s.index(end_marker, start) + len(end_marker)
          replacement = '''  const loadData = useCallback(async (currentUser: User) => {
            const now = Date.now();
            if (lastLoadRef.current?.userId === currentUser.id && now - lastLoadRef.current.at < 800) return;
            lastLoadRef.current = { userId: currentUser.id, at: now };
            setDataLoading(true);
            setDataError(null);
            try {
              const snapshot = await loadConectaData(currentUser, demoModeEnabled);
              if (snapshot.errorMessage) {
                setDataError(snapshot.errorMessage);
                toast.error(`No se pudo sincronizar todo: ${snapshot.errorMessage}`);
              }
              setProfile(snapshot.profile);
              setTrust(snapshot.trust);
              setPlans(snapshot.plans);
              setPlanMembers(snapshot.planMembers);
              setProfiles(snapshot.profiles);
              setConnections(snapshot.connections);
              setCommunities(snapshot.communities);
              setCommunityMembers(snapshot.communityMembers);
              setConversations(snapshot.conversations);
              setSelectedConversation((current) => current ?? snapshot.conversations[0]?.id ?? null);
              setNotifications(snapshot.notifications);
              setSavedItems(snapshot.savedItems);
            } catch (error) {
              const message = error instanceof Error ? error.message : "Error inesperado al sincronizar";
              setDataError(message);
              toast.error(`No se pudo sincronizar todo: ${message}`);
            } finally {
              setDataLoading(false);
            }
          }, [demoModeEnabled]);'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Install
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Build
        run: npm run build
      - name: Automated smoke tests
        run: npm run test:smoke
      - name: Commit wiring
        run: |
          git config user.name 'conecta-robot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Wire bounded loader into App shell'
          git push origin HEAD:perf-wire-data-layer
