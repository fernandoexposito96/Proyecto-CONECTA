name: NORA Professional Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Playwright engines
        run: pnpm exec playwright install --list

      - name: Static validation
        run: pnpm run lint && pnpm run check && pnpm run test:unit

      - name: Build
        run: pnpm run build

      - name: Existing CONECTA contracts
        run: pnpm run test:smoke && pnpm run test:performance && pnpm run test:security

      - name: Browser, iPhone and accessibility tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
