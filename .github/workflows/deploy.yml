name: Deploy CONECTA Premium Max

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed versions
        run: npm ls @supabase/supabase-js@2.115.0 react@19.2.6 react-dom@19.2.6 vite@8.2.2 typescript@5.9.3 @vitejs/plugin-react@6.0.2 --depth=0
      - name: Production security audit (non-blocking deploy signal)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Structure, tests and type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install isolated browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Demo browser, mobile and accessibility tests
        run: npm run test:e2e
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
