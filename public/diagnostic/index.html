<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>NORA · Diagnóstico CONECTA</title>
<style>
:root{color-scheme:dark;--bg:#070a12;--panel:#101626;--line:#25304a;--text:#f8fafc;--muted:#9ca9c4;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#17162a 0,#070a12 42%);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button{font:inherit}.wrap{max-width:1040px;margin:auto;padding:18px 14px 56px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand{display:flex;gap:11px;align-items:center}.avatar{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#7c3aed,#a855f7);display:grid;place-items:center;font-size:26px}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.badge{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#0d1321;color:#c6d0e5;font-size:12px}.hero{background:linear-gradient(180deg,#11192b,#0d1321);border:1px solid var(--line);border-radius:24px;padding:18px}.hero-grid{display:grid;grid-template-columns:150px 150px 1fr;gap:16px;align-items:center}.score{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--tone) var(--pct,0%),#202940 0);position:relative}.score:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#0f1626}.score strong{position:relative;z-index:1;font-size:34px}.score small{position:absolute;z-index:1;margin-top:58px;color:var(--muted);font-size:10px}.hero h2{margin:0 0 7px}.hero p{margin:0;color:var(--muted)}.countdown{margin-top:9px;color:#cbd5e1;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:13px;border:1px solid var(--line);background:#0e1525;border-radius:16px;text-align:left;color:var(--text);cursor:pointer}.stat.active{border-color:var(--purple);background:#15152b}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #3a4770;background:#141d32;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}.actions .primary{background:#6d28d9;border-color:#7c3aed}.actions .scan{background:linear-gradient(135deg,#7c3aed,#db2777);border:0}.actions button:disabled{opacity:.55;cursor:not-allowed}.scan-state{font-size:12px;color:var(--muted);min-height:18px;margin:-4px 0 12px}.filter-title{margin:6px 0 2px;color:#d7dff0;font-size:13px;display:flex;justify-content:space-between}.filter-title button{border:0;background:transparent;color:#93c5fd;cursor:pointer}.layer{margin-top:14px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0d1321}.layer.hidden{display:none}.layer h3{margin:0;padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.errors h3{color:#fca5a5}.watch h3{color:#fcd34d}.corrected h3,.positives h3{color:#86efac}.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 14px;border-bottom:1px solid #1d2740}.item:last-child{border-bottom:0}.dot{width:23px;height:23px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900}.fail .dot{background:#47191d;color:#fca5a5}.warn .dot{background:#422f10;color:#fcd34d}.ok .dot{background:#163823;color:#86efac}.item b{display:block;font-size:13px}.item p{margin:2px 0 0;color:var(--muted);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:15px;color:var(--muted);font-size:12px}.toast{position:fixed;right:14px;bottom:18px;max-width:min(360px,calc(100vw - 28px));background:#111827;border:1px solid #374151;border-radius:12px;padding:10px 12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:none}@media(max-width:760px){.hero-grid{grid-template-columns:112px 112px 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero-grid{grid-template-columns:1fr 1fr}.hero-copy{grid-column:1/-1}.score{max-width:132px;width:100%;justify-self:center}.toolbar .actions{width:100%}.actions button{flex:1}.badge{display:none}.item{grid-template-columns:25px 1fr}.item .sev{display:none}}
</style>
</head>
<body>
<main class="wrap"><header class="top"><div class="brand"><div class="avatar">🧠</div><div><h1>NORA · CONECTA</h1><p>Diagnóstico completo de la aplicación</p></div></div><div class="badge">Cada 5 horas · capacidad 999</div></header><section id="app">Cargando último diagnóstico…</section></main><div id="toast" class="toast" role="status"></div>
<script>
const FUNCTION_URL='https://qdjuypoqiafqncwgmicf.supabase.co/functions/v1/conecta-robot-control';
const API_KEY='sb_publishable_cJAhkB9oDjK-ecmrEshNvA_79F3_G55';
const labels={healthy:'Todo estable',warning:'Hay averías o puntos que vigilar',error:'Hay fallos',critical:'Hay fallos críticos'};
const meta={errors:{name:'Fallos',cls:'fail'},watch:{name:'Averías / Vigilar',cls:'warn'},corrected:{name:'Corregidos',cls:'ok'},positives:{name:'Positivos',cls:'ok'}};
const state={data:null,filter:'all',loading:false,scan:false,poll:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
async function robot(body){const r=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error==='github_credentials_missing'?'Faltan las credenciales seguras de GitHub en el robot.':data.error==='robot_off'?'El robot está apagado.':data.error==='origin_not_allowed'?'NORA no reconoce este origen de la aplicación.':data.error||`Error ${r.status}`);return data}
function normalize(d){const all=(d.results||[]).slice(0,999),errors=(d.errors||all.filter(x=>x.status==='fail')).slice(0,999),watch=(d.watch||all.filter(x=>x.status==='warn'||(x.status==='ok'&&x.severity==='warning'))).slice(0,Math.max(0,999-errors.length)),corrected=(d.corrected||[]).slice(0,999),positives=(d.positives||all.filter(x=>x.status==='ok'&&x.severity!=='warning')).slice(0,999);return{...d,all,errors,watch,corrected,positives}}
const row=(x,type)=>`<div class="item ${meta[type].cls}"><div class="dot">${type==='errors'?'×':type==='watch'?'!':'✓'}</div><div><b>${esc(x.label)}</b><p>${esc(x.detail)}</p><p>${esc(x.area||'')}</p></div><div class="sev">${esc(type==='corrected'?'corregido':type==='positives'?'positivo':x.severity||'')}</div></div>`;
function layer(type,items){return`<section class="layer ${type}" data-layer="${type}"><h3>${meta[type].name}<small>${items.length}</small></h3>${items.length?items.map(x=>row(x,type)).join(''):'<div class="empty">Sin elementos en esta categoría.</div>'}</section>`}
function remaining(){if(!state.data)return'';const ms=new Date(state.data.finished_at).getTime()+5*60*60*1000-Date.now();if(ms<=0)return'pendiente/inminente';const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function render(){const d=state.data;if(!d)return;const health=Math.max(0,Math.min(100,Number(d.score)||0)),active=d.errors.length+d.watch.length,tone=d.overall==='healthy'?'var(--green)':d.overall==='warning'?'var(--amber)':'var(--red)',findTone=d.errors.length?'var(--red)':d.watch.length?'var(--amber)':'var(--green)',pct=Math.min(100,active/999*100),time=new Date(d.finished_at).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'medium'});document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div class="score" style="--pct:${health}%;--tone:${tone}"><strong>${health}%</strong><small>SALUD</small></div><div class="score" style="--pct:${pct}%;--tone:${findTone}"><strong>${active}<span style="font-size:.48em;color:var(--muted)">/999</span></strong><small>ACTIVOS</small></div><div class="hero-copy"><h2>${esc(labels[d.overall]||d.overall)}</h2><p>NORA ha revisado ${d.all.length} comprobaciones.</p><p>Último escaneo: <b>${esc(time)}</b></p><div class="countdown">Próximo automático aprox.: <b id="countdown">${remaining()}</b></div></div></div><div class="stats"><button class="stat" data-filter="errors" onclick="setFilter('errors')"><b>${d.errors.length}</b><span>FALLOS</span></button><button class="stat" data-filter="watch" onclick="setFilter('watch')"><b>${d.watch.length}</b><span>AVERÍAS / VIGILAR</span></button><button class="stat" data-filter="corrected" onclick="setFilter('corrected')"><b>${d.corrected.length}</b><span>CORREGIDOS</span></button><button class="stat" data-filter="positives" onclick="setFilter('positives')"><b>${d.positives.length}</b><span>POSITIVOS</span></button></div></section><div class="toolbar"><small>Commit: ${esc(String(d.commit||'').slice(0,10))}</small><div class="actions"><button class="primary" onclick="refreshReport()">Actualizar panel</button><button id="scanBtn" class="scan" onclick="scanNow()">Escaneo completo ahora</button></div></div><div id="scanState" class="scan-state"></div><div class="filter-title"><span id="filterLabel">Mostrando las cuatro categorías</span><button onclick="setFilter('all')">Ver todo</button></div>${layer('errors',d.errors)}${layer('watch',d.watch)}${layer('corrected',d.corrected)}${layer('positives',d.positives)}`;setFilter(state.filter);updateScanUI()}
window.setFilter=filter=>{state.filter=filter;document.querySelectorAll('.stat').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));document.querySelectorAll('.layer').forEach(x=>x.classList.toggle('hidden',filter!=='all'&&x.dataset.layer!==filter));const el=document.querySelector('#filterLabel');if(el)el.textContent=filter==='all'?'Mostrando las cuatro categorías':`Mostrando solo: ${meta[filter].name}`}
function updateScanUI(msg=''){const btn=document.querySelector('#scanBtn'),box=document.querySelector('#scanState');if(btn){btn.disabled=state.scan;btn.textContent=state.scan?'Escaneando…':'Escaneo completo ahora'}if(box)box.textContent=msg||(state.scan?'NORA está ejecutando un escaneo completo. El panel se actualizará automáticamente al terminar.':'')}
async function load(manual=false){if(state.loading)return;state.loading=true;try{const r=await fetch(`./report.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);state.data=normalize(await r.json());render();if(manual)toast('Panel actualizado')}catch(e){if(!state.data)document.querySelector('#app').innerHTML=`<div class="empty">No se pudo cargar el informe: ${esc(e.message)}</div>`;else toast('No se pudo actualizar')}finally{state.loading=false}}
window.refreshReport=()=>load(true);
window.scanNow=async()=>{if(state.scan)return;state.scan=true;updateScanUI();try{const res=await robot({action:'scan_now',scan_mode:'full'});toast('Escaneo completo lanzado');updateScanUI('Escaneo lanzado. Esperando a que NORA termine…');startPoll(res.job?.id||null)}catch(e){state.scan=false;updateScanUI(e.message);toast(e.message)}};
function startPoll(jobId){clearInterval(state.poll);let tries=0;state.poll=setInterval(async()=>{tries++;try{const s=await robot({action:'status'}),job=(s.jobs||[]).find(x=>!jobId||x.id===jobId)||(s.jobs||[])[0];if(job?.status==='completed'){clearInterval(state.poll);state.scan=false;updateScanUI('Escaneo completado. Cargando nuevo informe…');await load(false);updateScanUI('Escaneo completado y panel actualizado.');toast('NORA actualizada')}else if(['failed','cancelled'].includes(job?.status)){clearInterval(state.poll);state.scan=false;updateScanUI(`El escaneo terminó con estado: ${job.status}. ${job.error_message||''}`)}else updateScanUI(`Escaneando… ${job?.status||'en cola'}`)}catch(e){updateScanUI(`Escaneando… ${e.message}`)}if(tries>180){clearInterval(state.poll);state.scan=false;updateScanUI('El escaneo sigue tardando más de lo esperado. Pulsa Actualizar panel en unos minutos.')}},5000)}
setInterval(()=>{const el=document.querySelector('#countdown');if(el)el.textContent=remaining()},1000);load(false);
</script>
</body>
</html>
