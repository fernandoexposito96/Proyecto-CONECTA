name: CONECTA Robot Repair Safe

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conecta-robot-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Baseline health check
        id: baseline
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm run check
          npm run build

      - name: Stop when healthy
        if: steps.install.outcome == 'success' && steps.baseline.outcome == 'success'
        run: echo 'CONECTA is healthy. No repair is needed.'

      - name: Attempt safe dependency-lock repair
        if: steps.install.outcome == 'failure' || steps.baseline.outcome == 'failure'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --omit=dev --ignore-scripts || true

      - name: Reject changes outside dependency lock
        if: steps.install.outcome == 'failure' || steps.baseline.outcome == 'failure'
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'No safe automatic repair is available for this failure.'
            exit 1
          fi
          unsafe="$(printf '%s\n' "$changed" | grep -v '^package-lock\.json$' || true)"
          if [ -n "$unsafe" ]; then
            echo 'Robot refused to modify application code or design:'
            printf '%s\n' "$unsafe"
            exit 1
          fi

      - name: Verify repaired state
        if: steps.install.outcome == 'failure' || steps.baseline.outcome == 'failure'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Create repair pull request
        if: steps.install.outcome == 'failure' || steps.baseline.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="robot/repair-${GITHUB_RUN_ID}"
          git config user.name 'conecta-robot'
          git config user.email 'conecta-robot@users.noreply.github.com'
          git switch -c "$branch"
          git add package-lock.json
          git commit -m 'chore: safe automatic dependency repair'
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title 'Robot Repair: safe dependency repair' \
            --body 'Automatic safe repair generated by CONECTA Robot Repair. Only package-lock.json was allowed to change. The full CONECTA check, production build, and high-severity production audit passed after the repair. This PR is intentionally not auto-merged.'
