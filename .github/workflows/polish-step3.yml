name: CONECTA Step 3 Polish
on:
  push:
    branches: [polish-step3]
    paths: [.github/workflows/polish-step3.yml]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-step3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire targeted refreshes safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          anchor='import { loadConectaData } from "./data/loadConectaData";'
          imp=anchor+'\nimport { refreshConnections, refreshConversations, refreshPlanMembers, refreshSavedItems } from "./data/refreshConectaSlices";'
          if 'refreshConectaSlices' not in s:
              s=s.replace(anchor,imp)
          replacements=[
          ('    await loadData(user);\n  };\n\n  const savePlan', '    setPlanMembers(await refreshPlanMembers());\n  };\n\n  const savePlan'),
          ('    await loadData(user);\n  };\n\n  const connectWith', '    setSavedItems(await refreshSavedItems(user.id));\n  };\n\n  const connectWith'),
          ('    await loadData(user);\n  };\n\n  const openDirectChat', '    setConnections(await refreshConnections());\n  };\n\n  const openDirectChat'),
          ('    await loadData(user);\n    setSelectedConversation(String(data));', '    setConversations(await refreshConversations());\n    setSelectedConversation(String(data));'),
          ('    await loadData(user);\n  };\n\n  if (!authReady)', '    setConnections(await refreshConnections());\n  };\n\n  if (!authReady)')]
          for old,new in replacements:
              if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npm run test:smoke
      - name: Commit validated polish
        run: |
          git config user.name 'conecta-robot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Use targeted refreshes for frequent actions'
          git push origin polish-step3
