name: CONECTA Validate

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: TypeScript
        run: pnpm run check
      - name: Unit tests
        run: pnpm run test:unit
      - name: Build
        run: pnpm run build
      - name: Automated smoke tests
        run: pnpm run test:smoke
      - name: Performance contracts
        run: pnpm run test:performance
      - name: Security contracts
        run: pnpm run test:security
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: End-to-end, mobile and accessibility tests
        run: pnpm run test:e2e
