name: CONECTA PWA Assets

on:
  push:
    branches: [main]
    paths:
      - 'public/icon.svg'
      - 'public/icon-maskable.svg'
      - 'public/manifest.webmanifest'
      - '.github/workflows/pwa-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conecta-pwa-assets
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production app
        run: npm run build

      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Start preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/conecta-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/conecta-preview.log
          exit 1

      - name: Generate install assets
        run: |
          mkdir -p public/screenshots
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size=512,512 "file://${GITHUB_WORKSPACE}/public/icon.svg" public/icon-512.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size=512,512 "file://${GITHUB_WORKSPACE}/public/icon-maskable.svg" public/icon-maskable-512.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size=390,844 --full-page http://127.0.0.1:4173/ public/screenshots/mobile.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size=1440,900 --full-page http://127.0.0.1:4173/ public/screenshots/wide.png

      - name: Commit generated assets
        run: |
          git config user.name 'conecta-assets-bot'
          git config user.email 'conecta-assets-bot@users.noreply.github.com'
          git add public/icon-512.png public/icon-maskable-512.png public/screenshots/mobile.png public/screenshots/wide.png
          if git diff --cached --quiet; then
            echo 'Assets already current.'
            exit 0
          fi
          git commit -m 'PWA: actualizar iconos PNG y screenshots instalables'
          git push origin HEAD:main
