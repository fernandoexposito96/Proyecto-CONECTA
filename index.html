  <title>CONECTA — Planes reales, gente compatible</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000}
    #app{visibility:hidden}
    html.boot-complete #app{visibility:visible}
    #boot-splash{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .24s ease,visibility .24s ease}
    #boot-splash .boot-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
    #boot-splash .boot-word{font-size:clamp(30px,8vw,46px);font-weight:800;letter-spacing:.16em;text-indent:.16em;line-height:1;white-space:nowrap}
    #boot-splash .boot-spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;box-sizing:border-box;animation:conecta-spin .78s linear infinite;will-change:transform}
    #boot-splash.boot-hide{opacity:0;visibility:hidden;pointer-events:none}
    @keyframes conecta-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#boot-splash .boot-spinner{animation-duration:1.6s}}
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite" aria-label="Cargando CONECTA">
    <div class="boot-content">
      <div class="boot-word">CONECTA</div>
      <div class="boot-spinner" aria-hidden="true"></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
