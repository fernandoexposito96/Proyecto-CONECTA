name: Deploy CONECTA Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate with automatic retries
        shell: bash
        run: |
          set -o pipefail
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "CONECTA validation attempt $attempt/$attempts"
            if npm run validate; then
              echo "Validation completed successfully."
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Validation failed. Waiting 15 seconds before retrying..."
              sleep 15
            fi
          done
          echo "Validation failed after $attempts attempts. Review the failing check and logs."
          exit 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
