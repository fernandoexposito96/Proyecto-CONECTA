name: CONECTA Hardening Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conecta-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protect-demo:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'perf/') ||
      startsWith(github.head_ref, 'fix/') ||
      startsWith(github.head_ref, 'db/') ||
      startsWith(github.head_ref, 'pwa/') ||
      startsWith(github.head_ref, 'robot/') ||
      startsWith(github.head_ref, 'chore/hardening-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Protect demo and visual structure
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^(src/(views|components|styles|data)/|src/App\.tsx$|index\.html$|public/)' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Hardening branch attempted to modify frozen demo/visual files:'
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full validation
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Bundle performance budget
        run: node scripts/check-bundle-budget.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
