<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>NORA · Diagnóstico CONECTA</title>
  <style>
    :root{color-scheme:dark;--bg:#070a12;--panel:#101626;--panel2:#151d31;--line:#25304a;--text:#f8fafc;--muted:#9ca9c4;--purple:#8b5cf6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#17162a 0,#070a12 42%);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    .wrap{max-width:980px;margin:auto;padding:18px 14px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px}.avatar{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#7c3aed,#a855f7);display:grid;place-items:center;font-size:26px;box-shadow:0 14px 35px #7c3aed44}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.badge{padding:8px 11px;border:1px solid var(--line);background:#0d1321;border-radius:999px;color:#c6d0e5;font-size:12px;white-space:nowrap}
    .hero{background:linear-gradient(180deg,#11192b,#0d1321);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 50px #0007}.hero-grid{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:center}.score{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--pct,0%),#202940 0);position:relative}.score:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#0f1626}.score strong{position:relative;z-index:1;font-size:34px}.score small{position:absolute;z-index:1;margin-top:54px;color:var(--muted)}.hero h2{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:13px;border:1px solid var(--line);background:#0e1525;border-radius:16px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:16px 0}.toolbar button{border:1px solid #3a4770;background:#141d32;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}.toolbar small{color:var(--muted)}
    .group{margin-top:12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0d1321}.group h3{margin:0;padding:13px 15px;border-bottom:1px solid var(--line);font-size:14px}.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 14px;border-bottom:1px solid #1d2740}.item:last-child{border-bottom:0}.dot{width:23px;height:23px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900}.ok .dot{background:#163823;color:#86efac}.warn .dot{background:#422f10;color:#fcd34d}.fail .dot{background:#47191d;color:#fca5a5}.item b{display:block;font-size:13px}.item p{margin:2px 0 0;color:var(--muted);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.sev{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .note{margin-top:16px;padding:13px 14px;border:1px dashed #34415f;border-radius:15px;color:#aab5cc;font-size:11px}.loading{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:640px){.wrap{padding:12px 10px 40px}.hero-grid{grid-template-columns:112px 1fr}.score strong{font-size:27px}.score small{margin-top:43px;font-size:10px}.stats{grid-template-columns:repeat(2,1fr)}.hero h2{font-size:20px}.item{grid-template-columns:25px 1fr}.sev{display:none}.badge{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="avatar">🧠</div><div><h1>NORA · CONECTA Diagnostic</h1><p>Ingeniera virtual de diagnóstico · solo lectura</p></div></div>
      <div class="badge">Escaneo cada hora</div>
    </header>
    <section id="app" class="loading">Cargando último diagnóstico…</section>
  </main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const label={healthy:'Todo estable',warning:'Hay avisos',error:'Hay errores',critical:'Hay fallos críticos'};
    async function load(){
      const app=document.querySelector('#app');
      try{
        const r=await fetch('./report.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
        const d=await r.json();
        const groups={}; for(const x of d.results||[])(groups[x.area]??=[]).push(x);
        const tone=d.overall==='healthy'?'var(--green)':d.overall==='warning'?'var(--amber)':'var(--red)';
        const time=new Date(d.finished_at).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'medium'});
        app.className='';
        app.innerHTML=`<section class="hero"><div class="hero-grid"><div class="score" style="--pct:${Number(d.score)||0}%;--green:${tone}"><strong>${esc(d.score)}/100</strong><small>salud</small></div><div><h2>${esc(label[d.overall]||d.overall)}</h2><p>NORA ha completado ${esc((d.results||[]).length)} comprobaciones de punta a punta.</p><p style="margin-top:6px">Último escaneo: <b>${esc(time)}</b></p></div></div><div class="stats"><div class="stat"><b>${esc(d.counts?.critical||0)}</b><span>CRÍTICOS</span></div><div class="stat"><b>${esc(d.counts?.errors||0)}</b><span>ERRORES</span></div><div class="stat"><b>${esc(d.counts?.warnings||0)}</b><span>AVISOS</span></div><div class="stat"><b>${esc(d.counts?.ok||0)}</b><span>CORRECTOS</span></div></div></section><div class="toolbar"><small>Commit: ${esc(String(d.commit||'').slice(0,10))}</small><button onclick="load()">Actualizar ahora</button></div>${Object.entries(groups).map(([name,items])=>`<section class="group"><h3>${esc(name)}</h3>${items.map(x=>`<div class="item ${esc(x.status)}"><div class="dot">${x.status==='ok'?'✓':x.status==='warn'?'!':'×'}</div><div><b>${esc(x.label)}</b><p>${esc(x.detail)}</p></div><div class="sev">${esc(x.severity)}</div></div>`).join('')}</section>`).join('')}<div class="note">${esc(d.coverage_note||'')}</div>`;
      }catch(e){app.className='loading';app.innerHTML='No se ha podido cargar el informe todavía. NORA volverá a intentarlo automáticamente.';}
    }
    load(); setInterval(load,60000);
  </script>
</body>
</html>
