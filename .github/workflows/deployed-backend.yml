name: CONECTA deployed backend safety

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/test-deployed-backend.mjs'
      - '.github/workflows/deployed-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/test-deployed-backend.mjs'
      - '.github/workflows/deployed-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify production rejects invalid access
        run: node scripts/test-deployed-backend.mjs
